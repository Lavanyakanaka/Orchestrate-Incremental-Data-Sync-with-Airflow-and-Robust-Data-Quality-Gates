version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres-airflow:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres-airflow:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW_CONN_ANALYTICAL_DW_CONN: postgresql://${ANALYTICAL_DB_USER:-dw_user}:${ANALYTICAL_DB_PASSWORD:-dw_password}@postgres-dw:5432/${ANALYTICAL_DB_NAME:-analytical_dw}
    ANALYTICAL_DB_HOST: postgres-dw
    ANALYTICAL_DB_PORT: 5432
    ANALYTICAL_DB_NAME: ${ANALYTICAL_DB_NAME:-analytical_dw}
    ANALYTICAL_DB_USER: ${ANALYTICAL_DB_USER:-dw_user}
    ANALYTICAL_DB_PASSWORD: ${ANALYTICAL_DB_PASSWORD:-dw_password}
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./tests:/opt/airflow/tests
  depends_on:
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy
    postgres-dw:
      condition: service_healthy

services:
  # 1. PostgreSQL Database for Airflow Metadata
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Separate PostgreSQL Instance for Analytical Data Warehouse
  postgres-dw:
    image: postgres:15-alpine
    container_name: postgres-dw
    environment:
      POSTGRES_USER: ${ANALYTICAL_DB_USER:-dw_user}
      POSTGRES_PASSWORD: ${ANALYTICAL_DB_PASSWORD:-dw_password}
      POSTGRES_DB: ${ANALYTICAL_DB_NAME:-analytical_dw}
    ports:
      - "${ANALYTICAL_DB_HOST_PORT:-5433}:5432"
    volumes:
      - dw_data:/var/lib/postgresql/data
      - ./sql/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/02_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICAL_DB_USER:-dw_user} -d ${ANALYTICAL_DB_NAME:-analytical_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Redis Broker for Celery Executor
  redis:
    image: redis:7.2-alpine
    container_name: airflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 4. Airflow Initialization Service
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname "Data" \
          --lastname "Engineer" \
          --role "Admin" \
          --email "admin@example.com" || true
    restart: "no"

  # 5. Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 6. Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: airflow scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 7. Airflow Celery Worker
  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: airflow celery worker
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_db_data:
  dw_data:
